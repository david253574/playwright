services:
  - type: web
    name: playwright-bot
    env: python
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: ./start_all.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
    disk:
      name: bot-data
      mountPath: /opt/render/project/src/user_data
      sizeGB: 1
